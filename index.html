<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock scissors and paper Game</title>
    <link rel="stylesheet" href="./styles.css" >
</head>
<body>
    <h1>WELCOME TO THE GAME: ROCK-PAPER-SCISSORS</h1>
    <div id="human-selection">
        <div class="btn-div">
            <button id="rock" class="human-selection-btn">✊</button>
        </div>
        <div class="btn-div">
            <button id="paper" class="human-selection-btn">✋</button>
        </div>
        <div  class="btn-div">
            <button id="scissors" class="human-selection-btn">✌️</button>
        </div>
    </div>
    <div id="result-display">
        <div id="message-display">
            <p id="winner-msg"></p>
        </div>
        <div id="score-display">
            <p>YOU :  <span id="human-result">0</span></p>
            <p><span id="computer-result">0</span>  : COMPUTER</p>
        </div>
    </div>
    <div id="output-message">
        <p id="game-winner"></p>
        <button id="reset-btn">Play Again!</button>
    </div>
    <script src="./main.js"></script>
</body>
</html>
